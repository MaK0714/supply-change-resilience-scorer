    popover.innerHTML = html;
}

window.removeNode = function(id) {
    STATE.nodes = STATE.nodes.filter(n => n.id !== id);
    STATE.edges = STATE.edges.filter(e => e.from !== id && e.to !== id);
    STATE.disrupted.delete(id);
    if (STATE.selected === id) STATE.selected = null;
    delete NODE_POS[id];
    
    if (window.hidePopover) window.hidePopover();
    const old = document.getElementById('edgeEditorPopup');
    if (old) old.remove();
    
    const base = runMaxFlow(new Set());
    STATE.baselineTotal = base.totalFlow;
    kahnTiers();
    updateState();
};

window.updateNodeCapacity = function(id, val) {
    const v = Number(val);
    if (isNaN(v)) return;
    const n = STATE.nodes.find(x => x.id === id);
    if (n) { 
        n.capacity = v; 
        const base = runMaxFlow(new Set());
        STATE.baselineTotal = base.totalFlow;
        updateState(); 
    }
};

window.updateEdgeFlow = function(from, to, val) {
    const v = Number(val);
    let eIdx = STATE.edges.findIndex(x => x.from === from && x.to === to);
    
    if (isNaN(v) || v <= 0 || val === '') {
        if (eIdx !== -1) STATE.edges.splice(eIdx, 1);
    } else {
        if (eIdx !== -1) STATE.edges[eIdx].flow = v;
        else STATE.edges.push({from, to, flow: v});
    }
    
    const base = runMaxFlow(new Set());
    STATE.baselineTotal = base.totalFlow;
    kahnTiers();
    updateState();
};

// redistributeFlow: when the user edits Actual In-Flow or Out-Flow,
// scale the connected edge capacities proportionally so the new total matches.
window.redistributeFlow = function(nodeId, direction, val) {
    const newTotal = Math.max(0, Number(val));
    if (isNaN(newTotal)) return;

    const edges = direction === 'in'
        ? STATE.edges.filter(e => e.to === nodeId)
        : STATE.edges.filter(e => e.from === nodeId);

    if (edges.length === 0) return;

    const currentTotal = edges.reduce((s, e) => s + e.flow, 0);

    if (currentTotal === 0 || newTotal === 0) {
        // Distribute evenly if no existing basis
        const share = newTotal === 0 ? 1 : Math.max(1, Math.round(newTotal / edges.length));
        edges.forEach(e => { e.flow = share; });
    } else {
        // Scale proportionally, ensure each edge gets at least 1
        edges.forEach(e => {
            e.flow = Math.max(1, Math.round((e.flow / currentTotal) * newTotal));
        });
    }

    const base = runMaxFlow(new Set());
    STATE.baselineTotal = base.totalFlow;
    kahnTiers();
    updateState();
};

// setEdgeActualFlow: user directly edits the green "actual" number on a specific edge.
// We set that edge's capacity to the requested value so the flow algorithm can route it.
window.setEdgeActualFlow = function(from, to, val) {
    const v = Math.max(1, Math.round(Number(val)));
    if (isNaN(v)) return;

    // Set this edge's capacity to the new value so the max-flow can push that much through
    let edge = STATE.edges.find(e => e.from === from && e.to === to);
    if (!edge) {
        edge = { from, to, flow: v };
        STATE.edges.push(edge);
    } else {
        edge.flow = v;
    }

    const base = runMaxFlow(new Set());
    STATE.baselineTotal = base.totalFlow;
    kahnTiers();
    updateState();
};

window.addNode = function() {
    const type = document.getElementById('selNodeType').value;
    const count = STATE.nodes.filter(n => n.type === type).length + 1;
    const id = `${type}${count}_${Math.random().toString(36).substr(2, 5)}`;
    
    let labelBase = "Farm";
    if (type === 'processor') labelBase = "Processor";
    else if (type === 'storage') labelBase = "Storage";
    else if (type === 'warehouse') labelBase = "Warehouse";
    else if (type === 'distributor') labelBase = "Distributor";
    else if (type === 'retailer') labelBase = "Retailer";
    const label = `${labelBase} ${count}`;
    
    let cap = 100;
    if (type === 'farm') cap = 100;
    else if (type === 'processor') cap = 150;
    else if (type === 'storage') cap = 200;
    else if (type === 'warehouse') cap = 200;
    else if (type === 'distributor') cap = 150;
    else if (type === 'retailer') cap = 75;
    
    STATE.nodes.push({ id, label, type, capacity: cap });
    
    const existingNodes = STATE.nodes.filter(n => n.type === type);
    const startY = 100;
    const Y_GAP = 130;
    let colX = COL.farm;
    if (type === 'processor') colX = COL.proc;
    else if (type === 'storage') colX = COL.storage;
    else if (type === 'warehouse') colX = COL.wh;
    else if (type === 'distributor') colX = COL.dist;
    else if (type === 'retailer') colX = COL.ret;
    
    let maxY = startY - Y_GAP;
    existingNodes.forEach(n => {
        if (n.id !== id && NODE_POS[n.id] && NODE_POS[n.id].y > maxY) {
            maxY = NODE_POS[n.id].y;
        }
    });
    
    NODE_POS[id] = { x: colX, y: maxY + Y_GAP };
    SVG_HEIGHT = Math.max(SVG_HEIGHT, maxY + Y_GAP + 100);
    
    const base = runMaxFlow(new Set());
    STATE.baselineTotal = base.totalFlow;
    kahnTiers();
    updateState();
};

// ─── Edge Inline Editor ───────────────────────────────────────────────────────

function showEdgeEditor(fromId, toId, currentFlow, mouseEvent) {
    const old = document.getElementById('edgeEditorPopup');
    if (old) old.remove();
    const fromNode = STATE.nodes.find(n => n.id === fromId);
    const toNode = STATE.nodes.find(n => n.id === toId);
    if (!fromNode || !toNode) return;
    const gc = $('graphContainer');
    const gcRect = gc.getBoundingClientRect();
    let px = mouseEvent.clientX - gcRect.left + 12;
    let py = mouseEvent.clientY - gcRect.top - 30;
    if (px + 240 > gc.offsetWidth) px -= 260;
    if (py < 0) py = 8;
    const isDark = STATE.dark;
    const el = document.createElement('div');
    el.id = 'edgeEditorPopup';
    el.style.cssText = `position:absolute;left:${px}px;top:${py}px;z-index:2000;background:${isDark?'rgba(15,23,42,0.97)':'rgba(255,255,255,0.97)'};border:1px solid ${isDark?'rgba(99,102,241,0.4)':'rgba(99,102,241,0.3)'};border-radius:12px;padding:14px 16px;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,0.4);font-family:Outfit,sans-serif;color:${isDark?'#f8fafc':'#0f172a'};`;
    el.innerHTML = `<div style="font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><span style="opacity:0.5;font-size:10px;letter-spacing:1px">EDGE</span><span style="color:#3b82f6">${fromNode.label}</span><span style="opacity:0.4">→</span><span style="color:#8b5cf6">${toNode.label}</span></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><label style="font-size:12px;opacity:0.7;flex-shrink:0;">Flow</label><input id="edgeFlowInput" type="number" min="1" value="${currentFlow}" style="flex:1;background:${isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.05)'};border:1px solid ${isDark?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.15)'};color:inherit;border-radius:6px;padding:5px 8px;font-family:Outfit,sans-serif;font-size:14px;font-weight:700;outline:none;width:80px;"/></div><div style="display:flex;gap:8px;"><button id="edgeSaveBtn" style="flex:1;padding:6px;background:rgba(59,130,246,0.2);color:#60a5fa;border:1px solid rgba(59,130,246,0.4);border-radius:6px;cursor:pointer;font-family:Outfit,sans-serif;font-weight:700;font-size:12px;">Apply</button><button id="edgeDeleteBtn" style="flex:1;padding:6px;background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.4);border-radius:6px;cursor:pointer;font-family:Outfit,sans-serif;font-weight:700;font-size:12px;">Delete Link</button></div>`;
    gc.appendChild(el);
    const input = document.getElementById('edgeFlowInput');
    input.focus(); input.select();
    document.getElementById('edgeSaveBtn').onclick = () => { const v = parseInt(input.value); if (!isNaN(v) && v > 0) updateEdgeFlow(fromId, toId, v); el.remove(); };
    document.getElementById('edgeDeleteBtn').onclick = () => { updateEdgeFlow(fromId, toId, 0); el.remove(); };
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') document.getElementById('edgeSaveBtn').click(); if (ev.key === 'Escape') el.remove(); });
    setTimeout(() => { const h = (ev) => { if (!el.contains(ev.target)) { el.remove(); document.removeEventListener('mousedown', h); } }; document.addEventListener('mousedown', h); }, 10);
}

function init() {
    attachStaticEvents();
    generateNetwork();
}
